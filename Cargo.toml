[package]
name = "chippy"
version = "0.1.0"
edition = "2024"

[profile.release]
lto = "fat"
codegen-units = 1

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
env_logger = "0.11.11"
fastrand = "2.5.0"
log = "0.4.35"
parking_lot = "0.13.0"
rodio = "0.23.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_with = "3.24.0"
softbuffer = "0.4.8"
toml = "1.2.1"
winit = { version = "0.30.13", features = ["serde", "rwh_05"] }
winit_input_helper = "0.17.0"
